<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0A12;overflow:hidden}three-d-stage:not(:defined){visibility:hidden}three-d-stage{width:100vw;height:100vh;display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<script src="./three-d-stage.js"></script>
</head>
<body>
<three-d-stage name="drip-drop" background="#0B0A12" autorotate></three-d-stage>
<script type="module">
  import * as THREE from 'three';
  const stage = document.querySelector('three-d-stage');
  const { THREE: T } = await stage.ready;

  const group = new T.Group();
  group.name = 'DripDrop';

  // Teardrop profile, lathed into a glossy droplet.
  const pts = [
    new T.Vector2(0.0, 0.0),
    new T.Vector2(0.46, 0.04),
    new T.Vector2(0.58, 0.22),
    new T.Vector2(0.52, 0.46),
    new T.Vector2(0.36, 0.7),
    new T.Vector2(0.16, 0.9),
    new T.Vector2(0.0, 1.05),
  ];
  const dropGeo = new T.LatheGeometry(pts, 64);
  dropGeo.computeVertexNormals();
  const dropMat = new T.MeshStandardMaterial({ name: 'accentGloss', color: 0x00D9BA, roughness: 0.15, metalness: 0.3 });
  const drop = new T.Mesh(dropGeo, dropMat);
  drop.name = 'droplet';
  drop.castShadow = true;
  drop.receiveShadow = true;
  group.add(drop);

  // Y2K halo ring, tilted.
  const ringGeo = new T.TorusGeometry(0.78, 0.025, 20, 96);
  const ringMat = new T.MeshStandardMaterial({ name: 'electricBlue', color: 0x1A11DE, roughness: 0.2, metalness: 0.4 });
  const ring = new T.Mesh(ringGeo, ringMat);
  ring.name = 'haloRing';
  ring.rotation.x = Math.PI / 2.3;
  ring.position.y = 0.5;
  ring.castShadow = true;
  group.add(ring);

  // Second thin orchid ring, opposite tilt.
  const ring2Geo = new T.TorusGeometry(0.62, 0.016, 16, 96);
  const ring2Mat = new T.MeshStandardMaterial({ name: 'orchid', color: 0xCC75C4, roughness: 0.25, metalness: 0.35 });
  const ring2 = new T.Mesh(ring2Geo, ring2Mat);
  ring2.name = 'haloRingInner';
  ring2.rotation.x = -Math.PI / 2.8;
  ring2.rotation.z = 0.4;
  ring2.position.y = 0.35;
  group.add(ring2);

  group.position.y = 0;
  stage.setObject(group);
  const sr = stage.shadowRoot;
  if (sr) {
    const toolbar = sr.querySelector('.toolbar');
    const note = sr.querySelector('.note');
    if (toolbar) toolbar.style.display = 'none';
    if (note) note.style.display = 'none';
  }
</script>
</body>
</html>
