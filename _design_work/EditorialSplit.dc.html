<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Bungee&family=DM+Serif+Display:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: #0E1018; color: #E8DFC8; }
    a { color: #48C8FF; text-decoration: none; }
    a:hover { color: #FF2020; }
    .mono { font-family: 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0E1018; display: grid; grid-template-columns: 1.35fr 1fr;">

  <!-- LEFT: hero copy on flat brand -->
  <div style="position: relative; padding: 130px 60px 60px 60px; display: flex; flex-direction: column; justify-content: center; background: #0E1018;">
    <span class="mono" style="font-size: 11px; color: #48C8FF; margin-bottom: 30px;">01 &middot; The fashion social network</span>
    <div style="font-family: 'DM Serif Display', 'Playfair Display', serif; font-style: italic; font-size: 268px; line-height: 0.88; color: #E8DFC8; letter-spacing: -0.02em; margin: 0 0 24px -6px;">Drip</div>
    <p style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; font-size: 22px; line-height: 1.35; color: #E8DFC8; max-width: 440px; margin: 0 0 40px 0;">Instagram is your life. Spotify is your sound. Drip is your <em style="font-style: normal; color: #48C8FF;">fit</em>.</p>
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-family: 'Bungee', 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #0E1018; background: #FF2020; padding: 14px 26px;">Pull Up</span>
      <span class="mono" style="font-size: 11px; color: #9A9088;">Beta &middot; For the vibe</span>
    </div>
  </div>

  <!-- RIGHT: poster window (cycles) -->
  <div style="position: relative; background: #1C2335; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    <img src="poster-lime.jpg" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">
    <!-- soft edge veil -->
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,16,24,0.28) 0%, rgba(14,16,24,0) 22%);"></div>
    <!-- top-right corner label showing which frame is playing -->
    <div style="position: absolute; top: 26px; right: 26px; display: flex; align-items: center; gap: 10px; z-index: 3;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #FF2020; box-shadow: 0 0 10px #FF2020;"></span>
      <span class="mono" style="font-size: 10px; color: #E8DFC8;">SPRAY / 03 of 13</span>
    </div>
    <!-- bottom tick marks: which poster is currently playing -->
    <div style="position: absolute; bottom: 30px; left: 30px; right: 30px; display: flex; gap: 4px; z-index: 3;">
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
      <span style="flex: 1; height: 2px; background: #E8DFC8;"></span>
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
      <span style="flex: 1; height: 2px; background: rgba(232,223,200,0.3);"></span>
    </div>
  </div>

  <!-- Fixed nav overlay across the whole hero -->
  <nav style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 44px; z-index: 5;">
    <div style="font-family: 'DM Serif Display', serif; font-style: italic; font-size: 26px; color: #E8DFC8;">Drip</div>
    <div style="display: flex; align-items: center; gap: 28px;">
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Manifest</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Genres</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Features</span>
      <span class="mono" style="font-size: 11px; color: #0E1018; background: #FF2020; padding: 10px 18px; font-family: 'Bungee', 'DM Mono', monospace; letter-spacing: 0.14em;">Pull Up</span>
    </div>
  </nav>

  <!-- Direction label -->
  <div style="position: absolute; bottom: 32px; right: 44px; display: flex; align-items: center; gap: 12px; z-index: 6;">
    <span style="width: 10px; height: 10px; background: #48C8FF; border-radius: 50%;"></span>
    <span class="mono" style="font-size: 11px; color: #E8DFC8; letter-spacing: 0.22em;">Direction B &middot; Editorial split</span>
  </div>
</div>
</x-dc>
</body>
</html>
