<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Bungee&family=DM+Serif+Display:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: #0E1018; color: #E8DFC8; }
    a { color: #48C8FF; text-decoration: none; }
    a:hover { color: #FF2020; }
    .mono { font-family: 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0E1018;">

  <!-- FULL-BLEED POSTER -->
  <img src="poster-crimson.jpg" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">

  <!-- Faint vignette so nav can read on any poster -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,16,24,0.42) 0%, rgba(14,16,24,0) 22%, rgba(14,16,24,0) 78%, rgba(14,16,24,0.5) 100%); pointer-events: none;"></div>

  <!-- NAV -->
  <nav style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 44px; z-index: 5;">
    <div style="font-family: 'DM Serif Display', serif; font-style: italic; font-size: 26px; color: #E8DFC8; letter-spacing: -0.01em;">Drip</div>
    <div style="display: flex; align-items: center; gap: 28px;">
      <span class="mono" style="font-size: 11px; color: #E8DFC8; font-weight: 600;">Manifest</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8; font-weight: 600;">Genres</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8; font-weight: 600;">Features</span>
      <span class="mono" style="font-size: 11px; color: #0E1018; background: #FF2020; padding: 10px 18px; font-weight: 700; font-family: 'Bungee', 'DM Mono', monospace; letter-spacing: 0.14em;">Pull Up</span>
    </div>
  </nav>

  <!-- TOP MICRO-COPY STRIP -->
  <div style="position: absolute; top: 88px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 44px; z-index: 5;">
    <span class="mono" style="font-size: 11px; color: #9A9088;">The fashion social network</span>
    <span class="mono" style="font-size: 11px; color: #48C8FF;">ESTD 2077</span>
  </div>

  <!-- VERTICAL BETA TAG -->
  <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: #FF2020; color: #0E1018; writing-mode: vertical-rl; font-family: 'Bungee', 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; padding: 22px 8px; z-index: 5;">Beta &middot; For the vibe</div>

  <!-- BOTTOM SCROLL INDICATOR -->
  <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 5;">
    <span class="mono" style="font-size: 11px; color: #E8DFC8; letter-spacing: 0.3em;">Scroll</span>
    <span style="display: inline-block; width: 36px; height: 1px; background: #E8DFC8;"></span>
  </div>

  <!-- LABEL: which direction is this -->
  <div style="position: absolute; bottom: 32px; left: 44px; display: flex; align-items: center; gap: 12px; z-index: 6;">
    <span style="width: 10px; height: 10px; background: #48C8FF; border-radius: 50%;"></span>
    <span class="mono" style="font-size: 11px; color: #E8DFC8; letter-spacing: 0.22em;">Direction A &middot; Full-bleed cycle</span>
  </div>

  <!-- POSTER PROGRESS DOTS (visual hint: one of many) -->
  <div style="position: absolute; bottom: 84px; left: 44px; display: flex; gap: 6px; z-index: 6;">
    <span style="width: 26px; height: 2px; background: #E8DFC8;"></span>
    <span style="width: 8px;  height: 2px; background: rgba(232,223,200,0.35);"></span>
    <span style="width: 8px;  height: 2px; background: rgba(232,223,200,0.35);"></span>
    <span style="width: 8px;  height: 2px; background: rgba(232,223,200,0.35);"></span>
    <span style="width: 8px;  height: 2px; background: rgba(232,223,200,0.35);"></span>
    <span style="width: 8px;  height: 2px; background: rgba(232,223,200,0.35);"></span>
  </div>
</div>
</x-dc>
</body>
</html>
