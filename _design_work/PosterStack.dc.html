<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Bungee&family=DM+Serif+Display:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: #0E1018; color: #E8DFC8; }
    a { color: #48C8FF; text-decoration: none; }
    a:hover { color: #FF2020; }
    .mono { font-family: 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0B1F44;">

  <!-- Diagonal grain ground -->
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, rgba(72,200,255,0.06) 0%, rgba(11,31,68,0) 60%), #0B1F44;"></div>

  <!-- FLANK LEFT (peeking) -->
  <div style="position: absolute; top: 130px; left: -80px; width: 320px; height: 640px; z-index: 2; transform: rotate(-4deg); opacity: 0.42; filter: blur(1px);">
    <img src="poster-thermal.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; box-shadow: 0 28px 80px rgba(0,0,0,0.5);">
  </div>

  <!-- FLANK RIGHT (peeking) -->
  <div style="position: absolute; top: 100px; right: -80px; width: 320px; height: 640px; z-index: 2; transform: rotate(5deg); opacity: 0.42; filter: blur(1px);">
    <img src="poster-denim.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; box-shadow: 0 28px 80px rgba(0,0,0,0.5);">
  </div>

  <!-- MID LEFT (mid-back) -->
  <div style="position: absolute; top: 160px; left: 200px; width: 400px; height: 580px; z-index: 3; transform: rotate(-2deg); opacity: 0.7;">
    <img src="poster-lime.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; box-shadow: 0 32px 90px rgba(0,0,0,0.55);">
  </div>

  <!-- MID RIGHT (mid-back) -->
  <div style="position: absolute; top: 130px; right: 200px; width: 400px; height: 580px; z-index: 3; transform: rotate(2.5deg); opacity: 0.7;">
    <img src="poster-starfield.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; box-shadow: 0 32px 90px rgba(0,0,0,0.55);">
  </div>

  <!-- CENTER FOCUS -->
  <div style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 500px; height: 680px; z-index: 4;">
    <img src="poster-crimson.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,223,200,0.08);">
  </div>

  <!-- NAV -->
  <nav style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 44px; z-index: 5;">
    <div style="font-family: 'DM Serif Display', serif; font-style: italic; font-size: 26px; color: #E8DFC8;">Drip</div>
    <div style="display: flex; align-items: center; gap: 28px;">
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Manifest</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Genres</span>
      <span class="mono" style="font-size: 11px; color: #E8DFC8;">Features</span>
      <span class="mono" style="font-size: 11px; color: #0E1018; background: #FF2020; padding: 10px 18px; font-family: 'Bungee', 'DM Mono', monospace; letter-spacing: 0.14em;">Pull Up</span>
    </div>
  </nav>

  <!-- TOP MICRO-COPY STRIP -->
  <div style="position: absolute; top: 88px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 44px; z-index: 5;">
    <span class="mono" style="font-size: 11px; color: rgba(232,223,200,0.75);">The fashion social network</span>
    <span class="mono" style="font-size: 11px; color: #48C8FF;">ESTD 2077</span>
  </div>

  <!-- VERTICAL BETA TAG -->
  <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: #FF2020; color: #0E1018; writing-mode: vertical-rl; font-family: 'Bungee', 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; padding: 22px 8px; z-index: 6;">Beta &middot; For the vibe</div>

  <!-- BOTTOM SCROLL INDICATOR -->
  <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 6;">
    <span class="mono" style="font-size: 11px; color: #E8DFC8; letter-spacing: 0.3em;">Scroll</span>
    <span style="display: inline-block; width: 36px; height: 1px; background: #E8DFC8;"></span>
  </div>

  <!-- Direction label -->
  <div style="position: absolute; bottom: 32px; left: 44px; display: flex; align-items: center; gap: 12px; z-index: 6;">
    <span style="width: 10px; height: 10px; background: #48C8FF; border-radius: 50%;"></span>
    <span class="mono" style="font-size: 11px; color: #E8DFC8; letter-spacing: 0.22em;">Direction C &middot; Poster stack</span>
  </div>
</div>
</x-dc>
</body>
</html>
